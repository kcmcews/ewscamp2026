<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Committee Dashboard - 2026 EWS Camp</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-purple: #2e1547;
            --secondary-purple: #4a2a6b;
            --accent-gold: #c5a059;
            --bg-light: #fdfbf7;
            --text-dark: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
        }

        nav {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
        }

        .back-btn {
            text-decoration: none;
            color: var(--primary-purple);
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            font-size: 1.05rem;
        }

        .back-btn i { margin-right: 8px; }

        .container {
            padding: 20px;
            max-width: 520px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .page-header {
            background: white;
            padding: 22px 20px;
            border-radius: 20px;
            border-top: 6px solid var(--primary-purple);
            box-shadow: 0 4px 15px rgba(74, 42, 107, 0.05);
            margin-bottom: 20px;
            text-align: center;
        }

        .page-title {
            color: var(--primary-purple);
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 4px 0;
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: #666;
            margin: 0;
        }

        /* Standard Segmented Tab Buttons */
        .tab-bar {
            display: flex;
            background: #e9e4ed;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            text-align: center;
            padding: 10px 12px;
            background: none;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            color: #666;
            cursor: pointer;
            border-radius: 9px;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary-purple);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .tab-btn i { margin-right: 6px; }

        .panel { display: none; }
        .panel.active { display: block; }

        .card-section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid #f0f0f0;
        }

        .section-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary-purple);
            margin: 0 0 14px 0;
            display: flex;
            align-items: center;
            border-bottom: 2px solid rgba(74, 42, 107, 0.1);
            padding-bottom: 8px;
        }

        .section-title i {
            margin-right: 10px;
            color: var(--accent-gold);
        }

        /* Search input wrapper */
        .search-box-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .search-box-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 0.95rem;
        }

        .search-input {
            width: 100%;
            padding: 10px 12px 10px 38px;
            border: 1.5px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
            background: #fafafa;
        }

        .search-input:focus {
            border-color: var(--primary-purple);
            background: white;
        }

        /* Check-in styles */
        .room-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f2f2f2;
            gap: 10px;
        }

        .room-row:last-child { border: none; }

        .room-info {
            flex: 1;
        }

        .room-info h5 {
            margin: 0;
            font-size: 0.95rem;
            color: var(--primary-purple);
            font-weight: 700;
        }

        .room-info p {
            margin: 2px 0 0 0;
            font-size: 0.8rem;
            color: #555;
        }

        .timestamps-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .timestamp-tag {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .timestamp-tag.in {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .timestamp-tag.out {
            background: #ede7f6;
            color: #512da8;
        }

        .status-toggle {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .status-toggle.checked {
            background: #e8f5e9;
            color: #2e7d32;
            border-color: #a5d6a7;
        }

        .status-toggle.checkedout {
            background: #ede7f6;
            color: #512da8;
            border-color: #d1c4e9;
        }

        .status-toggle.empty {
            background: #fafafa;
            color: #666;
        }

        /* Issue tracker form styles */
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--primary-purple);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--accent-gold);
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.9rem;
            background: #fdfcf9;
            color: var(--text-dark);
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary-purple);
            background: white;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-purple);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .submit-btn:hover {
            background: var(--secondary-purple);
        }

        /* Issue Item Container Card */
        .issue-item {
            border-left: 4px solid #f44336;
            padding: 14px;
            background: #fff8f8;
            border-radius: 0 12px 12px 0;
            margin-bottom: 14px;
            font-size: 0.88rem;
            position: relative;
            border-top: 1px solid #eee;
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
            transition: all 0.2s ease;
        }

        .issue-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--primary-purple);
            align-items: center;
            padding-right: 20px;
        }

        .resolution-wrapper {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
        }

        .resolution-wrapper label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #666;
            display: block;
            margin-bottom: 4px;
        }

        .resolution-input {
            width: 100%;
            padding: 8px;
            font-size: 0.85rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
            background: #fff;
            color: #333;
        }

        .resolve-action-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #2e7d32;
            margin-top: 10px;
        }

        .resolve-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #2e7d32;
        }

        .issue-item.resolved {
            border-left-color: #999 !important;
            background: #f7f7f7 !important;
            color: #888 !important;
            opacity: 0.65;
        }

        .issue-item.resolved .issue-header { color: #777 !important; }
        .issue-item.resolved .resolution-input { background: #eee; color: #777; border-color: #ddd; }
        .issue-item.resolved .resolve-action-container { color: #777 !important; }

        .delete-issue-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: none;
            border: none;
            color: #bbb;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .delete-issue-btn:hover { color: #f44336; }

        footer {
            text-align: center;
            padding: 25px 20px;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #e0e0e0;
            margin-top: 30px;
            background: white;
        }
    </style>
</head>
<body>

    <script>
        if (sessionStorage.getItem("committee_authenticated") !== "true") {
            window.location.href = "committee_gate.html";
        }
    </script>

    <nav>
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-chevron-left"></i> Back to Main
        </a>
    </nav>

    <div class="container">

        <div class="page-header">
            <h1 class="page-title">Committee Dashboard</h1>
            <p class="page-subtitle">Administrative room tracking & live camp issue logger</p>
        </div>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('checkin-panel', this)"><i class="fa-solid fa-bed"></i> Room Status</button>
            <button class="tab-btn" onclick="switchTab('issues-panel', this)"><i class="fa-solid fa-triangle-exclamation"></i> Issue Log</button>
        </div>
        
        <!-- Tab 1: Room Check-In/Out Panel -->
        <div id="checkin-panel" class="panel active">
            <div class="card-section">
                <h2 class="section-title"><i class="fa-solid fa-door-closed"></i> Check-In / Check-Out Tracker</h2>
                <p style="font-size:0.78rem; color:#666; margin:-6px 0 14px 0;">Tap status button to cycle states: <b>Vacant → Checked-In → Checked-Out</b></p>
                
                <!-- Search Box -->
                <div class="search-box-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="roomSearchInput" class="search-input" placeholder="Search camper name or unit..." oninput="filterRooms()">
                </div>

                <div id="roomsContainer"></div>
            </div>
        </div>

        <!-- Tab 2: Issue Management Log Panel -->
        <div id="issues-panel" class="panel">
            <div class="card-section">
                <h2 class="section-title"><i class="fa-solid fa-circle-plus"></i> Report New Logged Issue</h2>
                <div class="form-group">
                    <label>Location / Unit No</label>
                    <input type="text" id="issueLoc" class="form-control" placeholder="e.g., Tokyo B - T11, Seminar Hall">
                </div>
                <div class="form-group">
                    <label>Issue Description</label>
                    <textarea id="issueDesc" class="form-control" rows="2" placeholder="e.g., Aircond water leakage, broken light bulb..."></textarea>
                </div>
                <button class="submit-btn" onclick="addIssue()">Log Live Issue</button>
            </div>

            <div class="card-section">
                <h2 class="section-title"><i class="fa-solid fa-list-check"></i> Active Maintenance Tracker</h2>
                <div id="issuesListContainer"></div>
            </div>
        </div>

    </div>

    <footer>
        KLANG CHINESE METHODIST CHURCH © 2026
    </footer>

    <script>
        function switchTab(panelId, btn) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            btn.classList.add('active');
        }

        const officialRooms = [
            { id: "T1", name: "Tokyo A - T1", desc: "Amy Sim, Timothy Lee & Family" },
            { id: "T3", name: "Tokyo A - T3", desc: "David Kuah & Family" },
            { id: "T08", name: "Tokyo B - T08", desc: "Teh Lay Hong, Anggelina, Susan Mah" },
            { id: "T09", name: "Tokyo B - T09", desc: "Bishop Hwa Yung" },
            { id: "T10", name: "Tokyo B - T10", desc: "Tan Peck Leong, Chew Wooi Yean" },
            { id: "T11", name: "Tokyo B - T11", desc: "Ps. Lee Jun Yan, Isaiah, Frogen" },
            { id: "T12", name: "Tokyo B - T12", desc: "Stanley Ding & Family" },
            { id: "T13", name: "Tokyo B - T13", desc: "Ps Lucia Hii, Jamie Goh" },
            { id: "T15", name: "Tokyo B - T15", desc: "Tan Choon Phark, Lim Lay Lee" },
            { id: "T16", name: "Tokyo B - T16", desc: "Wong Ung Kwong, Tan Siew Li" },
            { id: "T17", name: "Tokyo B - T17", desc: "Yap Kim Kee, Yap Beng See" },
            { id: "T18", name: "Tokyo B - T18", desc: "David Teh, Jean Teh" },
            { id: "T19", name: "Tokyo B - T19", desc: "Yap Beng Hooi, Tan Geok Sim" },
            { id: "T20", name: "Tokyo B - T20", desc: "Joanne Teh, Joanne Chow, Laura, Grace" },
            { id: "T21", name: "Tokyo B - T21", desc: "Tan Peck Hoon, Peck Luan, Peck Hong" },
            { id: "T22", name: "Tokyo B - T22", desc: "Teh Wai Ling, Raymond Chang, Teoh Sok May" },
            { id: "T23", name: "Tokyo B - T23", desc: "Sharon Chan, Chan Peng Fong, Mabel" },
            { id: "T23A", name: "Tokyo B - T23A", desc: "Kang D-Way, John Lim, Beh Eng Seong" },
            { id: "T25", name: "Tokyo B - T25", desc: "Ng Fiew Ching, Ching Ing Hoe, Lee Ai Bee" },
            { id: "T27", name: "Tokyo B - T27", desc: "Tien Sen An, Nathan Liang, Lucas Lai" },
            { id: "T7", name: "Tokyo C - T7", desc: "Esther Lim, Ng Ai Ling, Ee Ling, Vooi Ling" },
            { id: "HKV", name: "HK Villa", desc: "Lim Sook Bee, Sheena Lee, Molly Yeoh, Cynthia Tan, Renate Johnston, Tean Pey Feng, Christina Tee, Shirley Ong, Andy Loh, Patrick Tee, Ng Choon Tat, The Swee Seng" }
        ];

        // Format Date Time: "Aug 19, 2:38 PM"
        function getFormattedTimestamp() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
            return `${dateStr}, ${timeStr}`;
        }

        // --- Room Status Tracker ---
        function loadRoomTracker(filterKeyword = "") {
            const container = document.getElementById('roomsContainer');
            container.innerHTML = '';
            
            const keyword = filterKeyword.toLowerCase().trim();
            const filteredRooms = officialRooms.filter(room => 
                room.name.toLowerCase().includes(keyword) || 
                room.desc.toLowerCase().includes(keyword)
            );

            if (filteredRooms.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888; font-size:0.85rem; padding: 20px 0;">No matching rooms or names found.</p>`;
                return;
            }

            filteredRooms.forEach(room => {
                const savedStatus = localStorage.getItem('ews2026_status_' + room.id) || "Vacant";
                const checkInTime = localStorage.getItem('ews2026_checkin_time_' + room.id) || "";
                const checkOutTime = localStorage.getItem('ews2026_checkout_time_' + room.id) || "";
                
                let badgeClass = "empty";
                if (savedStatus === "Checked-In") {
                    badgeClass = "checked";
                } else if (savedStatus === "Checked-Out") {
                    badgeClass = "checkedout";
                }

                // Render both timestamps if available
                let stampsHtml = "";
                if (checkInTime || checkOutTime) {
                    stampsHtml += `<div class="timestamps-row">`;
                    if (checkInTime) {
                        stampsHtml += `<span class="timestamp-tag in"><i class="fa-regular fa-clock"></i> In: ${checkInTime}</span>`;
                    }
                    if (checkOutTime) {
                        stampsHtml += `<span class="timestamp-tag out"><i class="fa-regular fa-clock"></i> Out: ${checkOutTime}</span>`;
                    }
                    stampsHtml += `</div>`;
                }

                container.innerHTML += `
                    <div class="room-row">
                        <div class="room-info">
                            <h5>${room.name}</h5>
                            <p>${room.desc}</p>
                            ${stampsHtml}
                        </div>
                        <button class="status-toggle ${badgeClass}" onclick="cycleRoomStatus('${room.id}')">${savedStatus}</button>
                    </div>
                `;
            });
        }

        function filterRooms() {
            const query = document.getElementById('roomSearchInput').value;
            loadRoomTracker(query);
        }

        function cycleRoomStatus(roomId) {
            const currentStatus = localStorage.getItem('ews2026_status_' + roomId) || "Vacant";
            let nextStatus = "Vacant";

            if (currentStatus === "Vacant") { 
                nextStatus = "Checked-In"; 
                localStorage.setItem('ews2026_checkin_time_' + roomId, getFormattedTimestamp());
            } else if (currentStatus === "Checked-In") { 
                nextStatus = "Checked-Out"; 
                localStorage.setItem('ews2026_checkout_time_' + roomId, getFormattedTimestamp());
            } else { 
                // Resetting to Vacant clears both records
                nextStatus = "Vacant"; 
                localStorage.removeItem('ews2026_checkin_time_' + roomId);
                localStorage.removeItem('ews2026_checkout_time_' + roomId);
            }

            localStorage.setItem('ews2026_status_' + roomId, nextStatus);

            const currentSearch = document.getElementById('roomSearchInput').value;
            loadRoomTracker(currentSearch);
        }

        // --- Issue Log Tracker ---
        function loadIssuesLog() {
            const container = document.getElementById('issuesListContainer');
            container.innerHTML = '';
            const issues = JSON.parse(localStorage.getItem('ews2026_camp_issues') || "[]");

            if(issues.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#888; font-size:0.85rem; margin:10px 0;">No issues currently logged.</p>`;
                return;
            }

            issues.forEach((issue, index) => {
                const isResolved = issue.status === "Resolved";
                const cardClass = isResolved ? "issue-item resolved" : "issue-item";
                const checkedAttr = isResolved ? "checked" : "";

                container.innerHTML += `
                    <div class="${cardClass}" id="issue-card-${index}">
                        <div class="issue-header">
                            <span><i class="fa-solid fa-location-dot" style="color:var(--accent-gold); margin-right:4px;"></i> ${issue.location}</span>
                            <button class="delete-issue-btn" onclick="deleteIssue(${index})"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                        <p style="margin:6px 0 10px 0; color:#444; font-weight:500;">${issue.description}</p>
                        
                        <!-- Resolution Action Box -->
                        <div class="resolution-wrapper">
                            <label>Resolution Action Notes</label>
                            <input type="text" class="resolution-input" id="res-input-${index}" 
                                value="${issue.resolution || ''}" oninput="saveResolution(${index}, this.value)" 
                                placeholder="Describe how it was fixed..." ${isResolved ? 'disabled' : ''}>
                        </div>

                        <!-- Mark Resolved Checkbox -->
                        <div class="resolve-action-container">
                            <input type="checkbox" class="resolve-checkbox" id="check-${index}" 
                                ${checkedAttr} onchange="toggleResolveCheckbox(${index}, this.checked)">
                            <label style="cursor:pointer;" for="check-${index}">Mark Issue as Resolved</label>
                        </div>
                    </div>
                `;
            });
        }

        function addIssue() {
            const loc = document.getElementById('issueLoc').value.trim();
            const desc = document.getElementById('issueDesc').value.trim();
            if(!loc || !desc) { alert("Please fill in location and description!"); return; }

            const issues = JSON.parse(localStorage.getItem('ews2026_camp_issues') || "[]");
            issues.push({ location: loc, description: desc, status: "Pending", resolution: "" });
            localStorage.setItem('ews2026_camp_issues', JSON.stringify(issues));
            
            document.getElementById('issueLoc').value = '';
            document.getElementById('issueDesc').value = '';
            loadIssuesLog();
        }

        function saveResolution(index, value) {
            const issues = JSON.parse(localStorage.getItem('ews2026_camp_issues') || "[]");
            issues[index].resolution = value;
            localStorage.setItem('ews2026_camp_issues', JSON.stringify(issues));
        }

        function toggleResolveCheckbox(index, checked) {
            const issues = JSON.parse(localStorage.getItem('ews2026_camp_issues') || "[]");
            issues[index].status = checked ? "Resolved" : "Pending";
            localStorage.setItem('ews2026_camp_issues', JSON.stringify(issues));
            loadIssuesLog();
        }

        function deleteIssue(index) {
            if(confirm("Delete this issue record permanently?")) {
                const issues = JSON.parse(localStorage.getItem('ews2026_camp_issues') || "[]");
                issues.splice(index, 1);
                localStorage.setItem('ews2026_camp_issues', JSON.stringify(issues));
                loadIssuesLog();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadRoomTracker();
            loadIssuesLog();
        });
    </script>
</body>
</html>
